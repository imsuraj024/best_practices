name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check_markdown_links.py

  flutter-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/architecture/clean-architecture-app
          - examples/state-management/local-state
          - examples/networking/repository-app
          - examples/testing/testing-app
          - examples/performance/performance-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: ${{ matrix.example }}
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: ${{ matrix.example }}
      - run: flutter analyze
        working-directory: ${{ matrix.example }}
      - run: flutter test
        working-directory: ${{ matrix.example }}

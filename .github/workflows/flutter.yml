name: Flutter Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - run: flutter --version
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
